services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
    ports: 
      - "5678:5678"     # expone un puerto del contenedor al host (sintaxis: PUERTO_HOST:PUERTO_CONTENEDOR)

  client_0:
    build:      # indica que docker debe construir la imagen del cliente a partir del Dockerfile ubicado en ./services/client
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:      # variables de entorno a configurar
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678      # pueden usar el mismo puerto los distintos clientes, ya que cada uno actua como una "computadora" independiente (no hay conflicto de puertos entre ellos)
      - INPUT_FILE=/input/input-0.csv
      - OUTPUT_FILE=/output/output-0.csv
    volumes:
      - ./input:/input      # mapea la carpeta ./input del host a la carpeta /input del contenedor (sintaxis: RUTA_HOST:RUTA_CONTENEDOR)
      - ./output:/output


